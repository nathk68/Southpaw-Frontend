name: Sync UFC Data

on:
  schedule:
    # Every Monday at 10:00 UTC (day after typical UFC Sunday events)
    - cron: '0 10 * * 1'
    # Every Sunday at 06:00 UTC (early morning after Saturday events)
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Specific event slug to process for historical stats (optional)'
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync historical stats
        id: sync-stats
        env:
          INPUT_SLUG: ${{ github.event.inputs.slug }}
          RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
          ADMIN_SYNC_TOKEN: ${{ secrets.ADMIN_SYNC_TOKEN }}
        run: |
          SLUG_PARAM=""
          if [ -n "$INPUT_SLUG" ]; then
            SLUG_PARAM="&slug=${INPUT_SLUG}"
          fi

          RESPONSE=$(curl -sf \
            "${RAILWAY_URL}/api/admin/sync-stats?token=${ADMIN_SYNC_TOKEN}${SLUG_PARAM}" \
            --max-time 90)

          UPDATED=$(echo "$RESPONSE" | jq -r '.updated')
          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"

          if [ "$UPDATED" = "true" ]; then
            echo "$RESPONSE" | jq '.data' > public/historical-predictions.json
            echo "Wrote updated historical-predictions.json"
          else
            echo "No new historical events: $(echo "$RESPONSE" | jq -r '.message')"
          fi

      - name: Sync upcoming fights
        id: sync-upcoming
        env:
          RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
          ADMIN_SYNC_TOKEN: ${{ secrets.ADMIN_SYNC_TOKEN }}
        run: |
          RESPONSE=$(curl -sf \
            "${RAILWAY_URL}/api/admin/sync-upcoming?token=${ADMIN_SYNC_TOKEN}" \
            --max-time 90)

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "$RESPONSE" | jq '.data' > public/upcoming-predictions.json
          echo "Wrote updated upcoming-predictions.json: $(echo "$RESPONSE" | jq -r '.message')"

      - name: Commit and push changes
        if: steps.sync-stats.outputs.updated == 'true' || steps.sync-upcoming.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/historical-predictions.json public/upcoming-predictions.json
          git diff --staged --quiet || git commit -m "chore: sync UFC data (stats + upcoming fights)"
          git push
